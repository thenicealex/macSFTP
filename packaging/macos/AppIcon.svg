<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Octane Studio Floor Soft Shadow -->
    <filter id="octane-floor-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Flap Ambient Occlusion -->
    <filter id="flap-ao" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#022c44" flood-opacity="0.5"/>
    </filter>

    <!-- Badge Depth Shadow -->
    <filter id="badge-depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#04324f" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#021f31" flood-opacity="0.2"/>
    </filter>

    <!-- Arrows Inset Shadow Filter -->
    <filter id="arrow-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#021b2b" flood-opacity="0.4"/>
    </filter>

    <!-- Deep Satin Matte Back Wall -->
    <linearGradient id="back-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Frosted Glass & Matte Plastic Front Flap -->
    <linearGradient id="frosted-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0ea5e9"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Flap Top Specular Chamfer Highlight -->
    <linearGradient id="chamfer-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Top Diffuse Studio Light Rim -->
    <linearGradient id="top-diffuse-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Diffuse Studio Overhead Spotlight -->
    <radialGradient id="studio-spot" cx="50%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Badge Subtle Ceramic Gradient -->
    <linearGradient id="ceramic-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Arrows Rich Blue Gradient -->
    <linearGradient id="arrow-gem-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <clipPath id="squircle-g2">
    <path d="M 284 100 C 196 100 152 110 126 136 C 100 162 100 206 100 294 L 100 730 C 100 818 110 862 136 888 C 162 914 206 924 294 924 L 730 924 C 818 924 862 914 888 888 C 914 862 924 818 924 730 L 924 294 C 924 206 914 162 888 136 C 862 110 818 100 730 100 Z"/>
  </clipPath>

  <!-- Squircle Base Chassis -->
  <g filter="url(#octane-floor-shadow)">
    <path d="M 284 100 C 196 100 152 110 126 136 C 100 162 100 206 100 294 L 100 730 C 100 818 110 862 136 888 C 162 914 206 924 294 924 L 730 924 C 818 924 862 914 888 888 C 914 862 924 818 924 730 L 924 294 C 924 206 914 162 888 136 C 862 110 818 100 730 100 Z" fill="url(#back-wall)"/>

    <!-- Inner Elements Clipped to Continuous Curvature Squircle -->
    <g clip-path="url(#squircle-g2)">
      
      <!-- Interior Pocket: Frosted Document Card -->
      <g filter="url(#flap-ao)">
        <rect x="230" y="180" width="564" height="230" rx="24" fill="#ffffff" fill-opacity="0.95"/>
        <line x1="284" y1="236" x2="480" y2="236" stroke="#0284c7" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
        <line x1="284" y1="270" x2="660" y2="270" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      </g>

      <!-- Front Folder Flap (Matte Plastic & Frosted Blue Glass) -->
      <g filter="url(#flap-ao)">
        <path d="M 100 350 L 390 350 C 414 350 435 338 448 322 L 482 278 C 496 260 516 250 540 250 L 880 250 C 905 250 924 270 924 295 L 924 924 L 100 924 Z" fill="url(#frosted-flap)"/>
        
        <!-- Flap Top Specular Chamfer Light Edge -->
        <path d="M 100 350 L 390 350 C 414 350 435 338 448 322 L 482 278 C 496 260 516 250 540 250 L 880 250 C 905 250 924 270 924 295" fill="none" stroke="url(#chamfer-light)" stroke-width="4"/>

        <!-- Diffuse Studio Spotlight across Face -->
        <rect x="100" y="250" width="824" height="674" fill="url(#studio-spot)"/>
      </g>

      <!-- Centerpiece: Ceramic White Circle Badge -->
      <circle cx="512" cy="620" r="185" fill="url(#ceramic-badge)" filter="url(#badge-depth)"/>
      <circle cx="512" cy="620" r="185" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>

      <!-- Crisp Bidirectional Vertical Transfer Arrows -->
      <!-- Left Arrow (Upload - Upward) -->
      <g fill="url(#arrow-gem-blue)" filter="url(#arrow-depth)">
        <polygon points="446,470 370,555 418,555 418,765 474,765 474,555 522,555"/>
      </g>

      <!-- Right Arrow (Download - Downward) -->
      <g fill="url(#arrow-gem-blue)" filter="url(#arrow-depth)">
        <polygon points="578,765 654,680 606,680 606,470 550,470 550,680 502,680"/>
      </g>

      <!-- Top Studio Diffuse Rim Light -->
      <path d="M 284 100 C 196 100 152 110 126 136 C 100 162 100 206 100 294 L 100 730 C 100 818 110 862 136 888 C 162 914 206 924 294 924 L 730 924 C 818 924 862 914 888 888 C 914 862 924 818 924 730 L 924 294 C 924 206 914 162 888 136 C 862 110 818 100 730 100 Z" fill="none" stroke="url(#top-diffuse-rim)" stroke-width="3.5"/>
    </g>
  </g>
</svg>