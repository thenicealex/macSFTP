[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/platform",
    "crates/sftp",
    "crates/storage",
    "crates/test_support",
    "crates/ui",
]
exclude = ["crates/vendor-russh"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.96.1"
version = "0.3.0"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-component = "=0.7.1"
gpui-kit-assets = "=0.7.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[patch.crates-io]
block = { path = "crates/vendor-block" }
russh = { path = "crates/vendor-russh" }
