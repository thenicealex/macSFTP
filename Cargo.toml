[workspace]
members = [
    "crates/app",
    "crates/native-menu",
    "crates/core",
    "crates/platform",
    "crates/sftp",
    "crates/storage",
    "crates/test_support",
    "crates/ui",
]
exclude = ["crates/vendor-russh"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.96.1"
version = "0.7.0"

[workspace.dependencies]
# Single UI dependency: GPUI (gpui-pre snapshot) and GPUI Base, pinned
# together by the Kit release. macSFTP draws its own controls, so the Kit's
# component and asset layers stay off.
gpui-kit = { version = "=0.8.0", default-features = false }
# Test-only companion of the Kit, pinned to the same GPUI snapshot: the
# visual-evidence capture test supplies this platform text system (real glyph
# metrics) to `HeadlessAppContext`. `font-kit` matches the feature gpui-kit
# enables for the shipped app, so captures and the app shape text identically.
gpui-pre-apple = { version = "=0.3.9", default-features = false, features = ["font-kit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[patch.crates-io]
block = { path = "crates/vendor-block" }
russh = { path = "crates/vendor-russh" }
