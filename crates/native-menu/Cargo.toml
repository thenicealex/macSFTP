[package]
name = "macsftp-native-menu"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/native_menu.rs"

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSMenu", "NSMenuItem", "NSView", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry"] }
raw-window-handle = "=0.6.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# User-authorized exception: only src/macos.rs may contain AppKit FFI.
# All other workspace crates continue to inherit unsafe_code = "forbid".
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
